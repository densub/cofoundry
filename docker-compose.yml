services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cofoundry-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    env_file:
      - ./backend/.env
    environment:
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:3001}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_ENV: ${VITE_SUPABASE_ENV:-TEST}
        VITE_SUPABASE_URL_PROD: ${VITE_SUPABASE_URL_PROD}
        VITE_SUPABASE_ANON_KEY_PROD: ${VITE_SUPABASE_ANON_KEY_PROD}
        VITE_SUPABASE_URL_TEST: ${VITE_SUPABASE_URL_TEST}
        VITE_SUPABASE_ANON_KEY_TEST: ${VITE_SUPABASE_ANON_KEY_TEST}
    container_name: cofoundry-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
