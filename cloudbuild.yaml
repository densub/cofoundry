# CI/CD: build images, push to Artifact Registry, deploy to Cloud Run on merge to main.
substitutions:
  _REGION: us-central1
  _AR_REPO: cofoundry
  _BACKEND_SERVICE: cofoundry-api
  _FRONTEND_SERVICE: cofoundry-web
  _API_URL: https://api.cofoundry.app
  _FRONTEND_URL: https://cofoundry.app

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_URL_PROD/versions/latest
      env: VITE_SUPABASE_URL_PROD
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_ANON_KEY_PROD/versions/latest
      env: VITE_SUPABASE_ANON_KEY_PROD
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_URL_PROD/versions/latest
      env: SUPABASE_URL_PROD
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_ANON_KEY_PROD/versions/latest
      env: SUPABASE_ANON_KEY_PROD
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_SERVICE_ROLE_KEY_PROD/versions/latest
      env: SUPABASE_SERVICE_ROLE_KEY_PROD
    - versionName: projects/$PROJECT_ID/secrets/ANTHROPIC_API_KEY/versions/latest
      env: ANTHROPIC_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_API_KEY/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/GITHUB_CLIENT_ID_PROD/versions/latest
      env: GITHUB_CLIENT_ID_PROD
    - versionName: projects/$PROJECT_ID/secrets/GITHUB_CLIENT_SECRET_PROD/versions/latest
      env: GITHUB_CLIENT_SECRET_PROD
    - versionName: projects/$PROJECT_ID/secrets/LINKEDIN_CLIENT_ID/versions/latest
      env: LINKEDIN_CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/LINKEDIN_CLIENT_SECRET/versions/latest
      env: LINKEDIN_CLIENT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/SENDGRID_API_KEY/versions/latest
      env: SENDGRID_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/SENDGRID_FROM_EMAIL/versions/latest
      env: SENDGRID_FROM_EMAIL

steps:
  # ── Backend ────────────────────────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest
      - ./backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend
    waitFor: [build-backend]

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv:
      - SUPABASE_URL_PROD
      - SUPABASE_ANON_KEY_PROD
      - SUPABASE_SERVICE_ROLE_KEY_PROD
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GITHUB_CLIENT_ID_PROD
      - GITHUB_CLIENT_SECRET_PROD
      - LINKEDIN_CLIENT_ID
      - LINKEDIN_CLIENT_SECRET
      - SENDGRID_API_KEY
      - SENDGRID_FROM_EMAIL
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3001 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars=NODE_ENV=production,SUPABASE_ENV=PROD,APP_URL=${_API_URL},FRONTEND_URL=${_FRONTEND_URL} \
          --set-secrets=SUPABASE_URL_PROD=SUPABASE_URL_PROD:latest,SUPABASE_ANON_KEY_PROD=SUPABASE_ANON_KEY_PROD:latest,SUPABASE_SERVICE_ROLE_KEY_PROD=SUPABASE_SERVICE_ROLE_KEY_PROD:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GITHUB_CLIENT_ID_PROD=GITHUB_CLIENT_ID_PROD:latest,GITHUB_CLIENT_SECRET_PROD=GITHUB_CLIENT_SECRET_PROD:latest,LINKEDIN_CLIENT_ID=LINKEDIN_CLIENT_ID:latest,LINKEDIN_CLIENT_SECRET=LINKEDIN_CLIENT_SECRET:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest \
          --quiet
        echo "${_API_URL}" > /workspace/backend_url.txt
    waitFor: [push-backend]

  # ── Frontend ───────────────────────────────────────────────────────────────
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    secretEnv:
      - VITE_SUPABASE_URL_PROD
      - VITE_SUPABASE_ANON_KEY_PROD
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build \
          -f frontend/Dockerfile.cloudrun \
          --build-arg VITE_SUPABASE_ENV=PROD \
          --build-arg VITE_SUPABASE_URL_PROD="$$VITE_SUPABASE_URL_PROD" \
          --build-arg VITE_SUPABASE_ANON_KEY_PROD="$$VITE_SUPABASE_ANON_KEY_PROD" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest \
          frontend
    waitFor: [deploy-backend]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend
    waitFor: [build-frontend]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=256Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars=BACKEND_URL=${_API_URL} \
          --quiet
        echo "Deployed frontend: ${_FRONTEND_URL}"
        echo "Deployed backend: ${_API_URL}"
        for SVC in ${_BACKEND_SERVICE} ${_FRONTEND_SERVICE}; do
          gcloud run services add-iam-policy-binding $$SVC \
            --region=${_REGION} \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet 2>/dev/null || true
        done
    waitFor: [push-frontend]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID
