# CI/CD: build images, push to Artifact Registry, deploy to Cloud Run on merge to main.
substitutions:
  _REGION: us-central1
  _AR_REPO: cofoundry
  _BACKEND_SERVICE: cofoundry-api
  _FRONTEND_SERVICE: cofoundry-web

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_URL/versions/latest
      env: VITE_SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_ANON_KEY/versions/latest
      env: VITE_SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_URL/versions/latest
      env: SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_ANON_KEY/versions/latest
      env: SUPABASE_ANON_KEY
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_SERVICE_ROLE_KEY/versions/latest
      env: SUPABASE_SERVICE_ROLE_KEY
    - versionName: projects/$PROJECT_ID/secrets/ANTHROPIC_API_KEY/versions/latest
      env: ANTHROPIC_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_API_KEY/versions/latest
      env: OPENAI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/GITHUB_CLIENT_ID/versions/latest
      env: GITHUB_CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/GITHUB_CLIENT_SECRET/versions/latest
      env: GITHUB_CLIENT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/LINKEDIN_CLIENT_ID/versions/latest
      env: LINKEDIN_CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/LINKEDIN_CLIENT_SECRET/versions/latest
      env: LINKEDIN_CLIENT_SECRET

steps:
  # ── Backend ────────────────────────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest
      - ./backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend
    waitFor: [build-backend]

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv:
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - LINKEDIN_CLIENT_ID
      - LINKEDIN_CLIENT_SECRET
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=3001 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars=NODE_ENV=production,APP_URL=placeholder,FRONTEND_URL=placeholder \
          --set-secrets=SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,LINKEDIN_CLIENT_ID=LINKEDIN_CLIENT_ID:latest,LINKEDIN_CLIENT_SECRET=LINKEDIN_CLIENT_SECRET:latest \
          --quiet
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "$$BACKEND_URL" > /workspace/backend_url.txt
        gcloud run services update ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --update-env-vars=APP_URL=$$BACKEND_URL \
          --quiet
    waitFor: [push-backend]

  # ── Frontend ───────────────────────────────────────────────────────────────
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    secretEnv:
      - VITE_SUPABASE_URL
      - VITE_SUPABASE_ANON_KEY
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        docker build \
          -f frontend/Dockerfile.cloudrun \
          --build-arg VITE_SUPABASE_URL="$$VITE_SUPABASE_URL" \
          --build-arg VITE_SUPABASE_ANON_KEY="$$VITE_SUPABASE_ANON_KEY" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest \
          frontend
    waitFor: [deploy-backend]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend
    waitFor: [build-frontend]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BACKEND_URL=$$(cat /workspace/backend_url.txt)
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --memory=256Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars=BACKEND_URL=$$BACKEND_URL \
          --quiet
        WEB_URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        gcloud run services update ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --update-env-vars=FRONTEND_URL=$$WEB_URL \
          --quiet
        echo "Deployed frontend: $$WEB_URL"
        echo "Deployed backend: $$BACKEND_URL"
        for SVC in ${_BACKEND_SERVICE} ${_FRONTEND_SERVICE}; do
          gcloud run services add-iam-policy-binding $$SVC \
            --region=${_REGION} \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet 2>/dev/null || true
        done
    waitFor: [push-frontend]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$BUILD_ID
